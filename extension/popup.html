<!doctype html>
<meta charset="utf-8" />
<style>
  body { font: 13px/1.5 system-ui, sans-serif; width: 300px; margin: 0; padding: 14px; color: #1b1b1b; }
  h1 { font-size: 14px; margin: 0 0 12px; }
  label { display: block; margin: 10px 0 4px; font-size: 12px; color: #555; }
  input[type=text], input[type=number] { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #ccc; border-radius: 6px; font: inherit; }
  .row { display: flex; align-items: center; gap: 8px; margin: 14px 0 6px; }
  .status { margin-top: 12px; padding: 8px 10px; border-radius: 6px; background: #f3f3f3; font-size: 12px; word-break: break-word; }
  button { width: 100%; padding: 8px; border: 0; border-radius: 6px; background: #1b1b1b; color: #fff; font: inherit; cursor: pointer; margin-top: 10px; }
</style>
<h1>Cartoon Auto Bridge</h1>
<label>Bridge port</label>
<input type="number" id="port" value="8765" />
<label>Bridge token (ต้องตรงกับ .env)</label>
<input type="text" id="token" placeholder="วาง BRIDGE_TOKEN ที่นี่" />
<div class="row"><input type="checkbox" id="enabled" /><label for="enabled" style="margin:0">เปิดรับงาน</label></div>
<button id="save">บันทึกและเชื่อมต่อ</button>
<div class="status" id="status">—</div>
<script src="popup.js"></script>
